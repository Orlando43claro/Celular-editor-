<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aparta tu Número - TalonarioDigital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- ESTILOS BASE --- */
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0eafc, #cfdef3); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #2c3e50; font-size: clamp(1.5em, 5vw, 2em); margin: 0; }
        #subtituloPrincipal { color: #34495e; font-size: clamp(1em, 3vw, 1.2em); margin-top: 5px; }

        /* --- BOTÓN VOLVER (A INICIO) --- */
        #backToHomeBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background: #34495e;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        
        #backToHomeBtn:hover {
            background: #2c3e50;
        }
        
        /* --- ESTILOS DE LA CUADRÍCULA --- */
        #talonario { max-width: 900px; width: 100%; padding: 0 10px; box-sizing: border-box; margin-bottom: 20px; }
        table { width: 100%; border-collapse: separate; border-spacing: 6px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); padding: 8px; table-layout: fixed; }
        td { width: 10%; height: 50px; background: linear-gradient(135deg, #6dd5fa, #2980b9); color: #fff; font-size: clamp(0.9em, 2.5vw, 1.1em); font-weight: 600; text-align: center; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        td:hover:not(.ocupado):not(.pagado) { transform: scale(1.05); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        
        /* Estilos de Estado */
        td.ocupado { background: #e74c3c; cursor: not-allowed; opacity: 0.8; } /* Apartado por cliente/vendedor */
        td.pagado { background: #2ecc71; cursor: not-allowed; opacity: 1; } /* Pagado - no disponible */
        td.pagado .numero { display: none; }
        td.pagado:after { content: '💵'; font-size: 1.5em; line-height: 1; }

        td.ocupado, td.pagado { 
            transform: none !important;
            box-shadow: none !important;
        }

        /* --- ESTILOS DEL MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); position: relative; }
        .cerrar { float: right; font-size: 1.5em; cursor: pointer; color: #333; }
        .modal-content label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #34495e; }
        .modal-content input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .modal-content button { padding: 12px; background: #2980b9; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; transition: background 0.2s; width: 100%; margin-top: 20px;}
        .modal-content button:hover { background: #3498db; }
        
        /* --- ESTILOS DE NOTIFICACIÓN --- */
        .notificacion { position: fixed; top: 20px; right: 20px; background: #00ff7f; color: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 127, 0.7); z-index: 2000; display: none; font-weight: 600;}
    </style>
</head>
<body>
    <a id="backToHomeBtn" href="inicio.html"><i class="fas fa-home"></i> Inicio</a>

    <header>
        <h1>TalonarioDigital</h1>
        <p id="subtituloPrincipal">Ingresa el PIN de tu vendedor para ver la rifa.</p>
    </header>

    <div id="vendedorInput" style="display: flex; gap: 10px; margin-bottom: 20px; width: 90%; max-width: 400px; align-items: center;">
        <i class="fas fa-key" style="font-size: 1.5em; color: #34495e;"></i>
        <input type="text" id="vendedorPinInput" placeholder="Ingresa el PIN de Acceso" required 
               minlength="6" maxlength="10" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px; flex-grow: 1;">
        <button id="cargarRifaBtn" style="padding: 10px 15px; background: #2ecc71;">Entrar</button>
    </div>

    <div id="talonario" style="display: none;">
        </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="cerrarModal" class="cerrar">×</span>
            <h2>Apartar Número <span id="numeroBoletoModal"></span></h2>
            <p>Introduce tus datos para apartar este número.</p>
            <form id="formRegistroCliente">
                <label for="nombreCliente">Tu Nombre:</label>
                <input type="text" id="nombreCliente" required>

                <label for="celularCliente">Tu Celular (WhatsApp):</label>
                <input type="tel" id="celularCliente" placeholder="Ej: 3155445183" required>
                
                <button type="submit" id="apartarBoletoBtn">Apartar</button>
            </form>
        </div>
    </div>
    
    <div id="notificacion" class="notificacion">
        <p id="mensajeNotificacion"></p>
    </div>
    
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        doc, 
        setDoc, 
        onSnapshot, 
        Timestamp,
        getDoc // Necesario para buscar el PIN
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    
    // ** La configuración de Firebase (DEBE SER LA REAL)**
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Referencia a la colección pública de PINES
    const publicKeysRef = collection(db, "publicKeys"); 
    
    // --- VARIABLES DE ESTADO ---
    let vendedorUidActual = null; 
    let unsubscribe = null; 
    let numeroBoletoSeleccionado = null;

    // --- DOM ELEMENTOS ---
    const talonarioDiv = document.getElementById('talonario');
    const modal = document.getElementById('modal');
    const formRegistroCliente = document.getElementById('formRegistroCliente');
    const numeroBoletoModal = document.getElementById('numeroBoletoModal');
    const vendedorPinInput = document.getElementById('vendedorPinInput');
    const vendedorInputDiv = document.getElementById('vendedorInput');
    const subtituloPrincipal = document.getElementById('subtituloPrincipal');
    const cargarRifaBtn = document.getElementById('cargarRifaBtn');


    // --- FUNCIÓN DE NOTIFICACIÓN ---
    function mostrarNotificacion(mensaje) {
        const notificacion = document.getElementById('notificacion');
        const mensajeNotificacion = document.getElementById('mensajeNotificacion');
        notificacion.style.background = mensaje.includes('Error') || mensaje.includes('⚠️') ? '#ff4757' : '#00ff7f';
        notificacion.style.boxShadow = mensaje.includes('Error') || mensaje.includes('⚠️') ? '0 0 15px rgba(255, 71, 87, 0.7)' : '0 0 15px rgba(0, 255, 127, 0.7)';
        
        mensajeNotificacion.textContent = mensaje;
        notificacion.style.animation = 'none';
        notificacion.offsetHeight; 
        // Nota: Las keyframes de slideIn/slideOut deben estar definidas en el CSS.
        notificacion.style.display = 'block';
        setTimeout(() => { notificacion.style.display = 'none'; }, 3000);
    }
    
    // --- FUNCIÓN PARA GENERAR EL TALONARIO (Vista cliente) ---
    function generarTalonarioCliente(datos) { 
        talonarioDiv.innerHTML = ''; 
        
        const tabla = document.createElement('table');
        let numero = 0;
        for (let i = 0; i < 10; i++) {
            const fila = document.createElement('tr');
            for (let j = 0; j < 10; j++) {
                const celda = document.createElement('td');
                const numStr = numero.toString().padStart(2, '0');
                celda.dataset.numero = numStr;
                celda.innerHTML = `<span class="numero">${numStr}</span>`;
                
                const boletoData = datos[numStr];
                const estado = boletoData ? boletoData.estado : 'disponible';
                
                celda.classList.remove('ocupado', 'pagado');

                if (estado === 'apartado') {
                    celda.classList.add('ocupado');
                } else if (estado === 'pagado') {
                     celda.classList.add('pagado');
                }

                if (estado === 'disponible') {
                    celda.addEventListener('click', function () {
                        mostrarModalCliente(numStr); 
                    });
                }

                fila.appendChild(celda);
                numero++;
            }
            tabla.appendChild(fila);
        }
        talonarioDiv.appendChild(tabla);
    }

    // --- FUNCIÓN PARA MOSTRAR EL MODAL DE APARTADO ---
    function mostrarModalCliente(numero) {
        numeroBoletoSeleccionado = numero;
        numeroBoletoModal.textContent = numero.padStart(2, '0');
        formRegistroCliente.reset();
        modal.style.display = 'flex';
    }
    
    // --- LÓGICA DE APARTADO DEL CLIENTE (USANDO 'CREATE') ---
    formRegistroCliente.onsubmit = async function (e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombreCliente').value;
        const celularInput = document.getElementById('celularCliente').value;
        const celularLimpio = celularInput.replace(/[^0-9]/g, ''); // Limpia caracteres no numéricos

        if (!vendedorUidActual || !numeroBoletoSeleccionado || celularLimpio.length < 7) {
            mostrarNotificacion('⚠️ Error: Falta información. Recarga la página.');
            return;
        }

        const dataApartado = {
            nombre: nombre,
            celular: celularLimpio,
            estado: 'apartado',
            fechaApartado: Timestamp.now()
        };
        
        const boletoRef = doc(db, 'users', vendedorUidActual, 'rifas', numeroBoletoSeleccionado);

        try {
            // setDoc con {merge: true} puede causar problemas de seguridad si el boleto ya existe.
            // Para el cliente NO autenticado, Firebase debe aplicar la regla de 'allow create'.
            await setDoc(boletoRef, dataApartado);
            
            modal.style.display = 'none';
            mostrarNotificacion(`¡Número ${numeroBoletoSeleccionado} apartado con éxito!`);

        } catch (error) {
            console.error('Error al apartar en Firebase:', error);
            // La regla de seguridad 'allow create' fallará si el documento ya existe (está apartado/pagado)
            if (error.code === 'permission-denied') { 
                mostrarNotificacion('⚠️ Este número acaba de ser apartado por otra persona. El talonario se actualizará.');
            } else {
                mostrarNotificacion('⚠️ Error desconocido al intentar apartar: ' + error.message);
            }
        }
    };

    // --- FUNCIÓN DE TIEMPO REAL DINÁMICA DE RIFAS (PÚBLICA) ---
    function iniciarOyenteTiempoRealCliente(uid) {
        if (unsubscribe) {
            unsubscribe();
            unsubscribe = null;
        }

        const boletosRef = collection(db, 'users', uid, 'rifas');
        
        unsubscribe = onSnapshot(boletosRef, (snapshot) => {
            let datos = {};
            snapshot.forEach(doc => {
                datos[doc.id] = doc.data();
            });
            generarTalonarioCliente(datos);
        }, (error) => {
            console.error('Error en el oyente de Firestore:', error);
            // Este error puede ocurrir si el UID es correcto pero las reglas fallan.
            mostrarNotificacion('Error de conexión con la rifa. (Verifica reglas de seguridad)');
        });
        
        talonarioDiv.style.display = 'block';
        subtituloPrincipal.textContent = 'Selecciona un número azul para apartarlo.';
    }
    
    // --- FUNCIÓN PRINCIPAL DE CARGA POR PIN ---
    cargarRifaBtn.onclick = async () => { 
        const pin = vendedorPinInput.value.trim();
        if (pin.length < 6) { 
            mostrarNotificacion('⚠️ Introduce un PIN válido (mínimo 6 caracteres).');
            return;
        }

        cargarRifaBtn.disabled = true;
        subtituloPrincipal.textContent = 'Buscando talonario...';

        try {
            // 1. Buscar el documento en publicKeys/{PIN} para obtener el UID
            const pinDoc = await getDoc(doc(publicKeysRef, pin));
            
            if (pinDoc.exists() && pinDoc.data().uid) {
                // 2. PIN encontrado, obtener el UID
                const uid = pinDoc.data().uid;
                vendedorUidActual = uid;
                
                // 3. Ocultar la entrada, iniciar el oyente
                vendedorInputDiv.style.display = 'none';
                iniciarOyenteTiempoRealCliente(vendedorUidActual);
                
            } else {
                mostrarNotificacion('⚠️ PIN no encontrado o incorrecto.');
                subtituloPrincipal.textContent = 'Ingresa el PIN de tu vendedor para ver la rifa.';
                cargarRifaBtn.disabled = false;
            }
            
        } catch (error) {
            console.error('Error al buscar PIN:', error);
            mostrarNotificacion('Error de conexión o permisos al buscar el PIN.');
            subtituloPrincipal.textContent = 'Ingresa el PIN de tu vendedor para ver la rifa.';
            cargarRifaBtn.disabled = false;
        }
    };

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {
        // Listeners del modal
        document.getElementById('cerrarModal').onclick = () => { modal.style.display = 'none'; };
        modal.onclick = (e) => { if (e.target === modal) { modal.style.display = 'none'; } };
    });
</script>
</body>
</html>
