<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Cliente - TalonarioDigital</title>
    <!-- Fuente y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2f1, #b2dfdb);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .access-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 {
            color: #00796b;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .pin-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1.5em;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 600;
        }
        .pin-form input:focus {
            border-color: #00796b;
            box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.2);
            outline: none;
        }
        #accessButton {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1em;
            background: linear-gradient(45deg, #00796b, #004d40);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 121, 107, 0.4);
            transition: opacity 0.2s, transform 0.1s;
        }
        #accessButton:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        p#message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
        .error-message {
            color: #d32f2f;
            background: #ffebee;
        }
        .success-message {
            color: #388e3c;
            background: #e8f5e9;
        }
        /* Para que solo permita 6 caracteres en el input number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
    <div class="access-container">
        <h2><i class="fas fa-lock"></i> Acceso Cliente</h2>
        <p style="color: #555; margin-bottom: 25px;">Ingresa tu PIN de 6 dígitos</p>
        
        <form id="pinForm" class="pin-form">
            <input type="number" id="pinInput" placeholder="______" required maxlength="6" inputmode="numeric">
            <button type="submit" id="accessButton">
                <i class="fas fa-arrow-right"></i> Ver Rifa
            </button>
        </form>

        <p id="message"></p>
        <button onclick="window.location.href='index.html'" style="background: none; border: none; color: #00796b; cursor: pointer; margin-top: 20px; font-size: 0.9em;">
            Volver a Opciones
        </button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js"; 

    // ** REEMPLAZA ESTO CON TU CONFIGURACIÓN REAL DE FIREBASE **
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    // Inicializar Firebase, Auth y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- ELEMENTOS DEL DOM ---
    const pinForm = document.getElementById('pinForm');
    const pinInput = document.getElementById('pinInput');
    const messageDisplay = document.getElementById('message');

    function showMessage(msg, isError = false) {
        messageDisplay.textContent = msg;
        messageDisplay.className = isError ? 'error-message' : 'success-message';
        messageDisplay.style.display = 'block';
    }

    // Limitar la longitud del PIN a 6 dígitos
    pinInput.oninput = function() {
        if (this.value.length > this.maxLength) {
            this.value = this.value.slice(0, this.maxLength);
        }
    }

    // --- MANEJADOR DE EVENTOS PRINCIPAL ---
    pinForm.onsubmit = async (e) => {
        e.preventDefault();
        
        const pin = pinInput.value.trim();
        
        if (pin.length !== 6) {
            showMessage("El PIN debe ser de 6 dígitos.", true);
            return;
        }

        showMessage('Buscando rifa...', false);

        try {
            // 1. BUSCAR UN VENDEDOR CON ESE PIN Y EL ROL 'vendedor'
            const clientesRef = collection(db, "clientes");
            const q = query(clientesRef, where("pin", "==", pin), where("rol", "==", "vendedor"));

            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                showMessage("PIN no válido. Intenta de nuevo.", true);
            } else {
                // 2. PIN ENCONTRADO, REDIRIGIR
                const vendedorDoc = querySnapshot.docs[0];
                const vendedorUID = vendedorDoc.id;
                
                // Guardar el UID del vendedor para que cliente.html sepa qué rifa mostrar
                localStorage.setItem('vendedorUID', vendedorUID);

                showMessage("Acceso concedido. Redirigiendo...", false);

                // 3. Redirigir a la vista de cliente (solo lectura)
                setTimeout(() => {
                    window.location.href = 'cliente.html';
                }, 1500);
            }

        } catch (error) {
            console.error("Error al buscar PIN:", error);
            showMessage("Error del sistema. Intenta más tarde.", true);
        }
    };
    
</script>
</body>
</html>
