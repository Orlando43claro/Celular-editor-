<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registro - Vendedor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .auth-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            color: #00bcd4;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .auth-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .auth-form input:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.1);
            outline: none;
        }
        #authButton {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1em;
            background: linear-gradient(45deg, #00bcd4, #00838f);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4);
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        #authButton:hover {
            opacity: 0.9;
        }
        p#message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            display: block;
            color: #212529;
        }
        button#toggleAuth, button#resetPasswordLink {
            background: none;
            border: none;
            color: #00bcd4;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.9em;
            display: block;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            transition: color 0.2s;
        }
        button#toggleAuth:hover, button#resetPasswordLink:hover {
            color: #00838f;
        }
        .pin-display {
            background: #e0f7fa;
            border: 2px dashed #00bcd4;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.5em;
            font-weight: 700;
            color: #00838f;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pin-display span {
            font-size: 1.2em;
            color: #d81b60; /* Color llamativo para el PIN */
            letter-spacing: 2px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="authTitle">Iniciar Sesión</h2>
        
        <form id="authForm" class="auth-form">
            <input type="text" id="username" placeholder="Nombre de Vendedor" style="display:none;">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <input type="number" id="pin" placeholder="PIN de Acceso para Clientes (6 dígitos)" required maxlength="6" style="display:none;">
            
            <button type="submit" id="authButton">Ingresar</button>
        </form>

        <p id="message"></p>

        <button id="toggleAuth">¿No tienes cuenta? Regístrate como Vendedor</button>
        <button id="resetPasswordLink">¿Olvidaste tu contraseña?</button>
    </div>

<script type="module">
    // Importar las funciones necesarias de Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        sendPasswordResetEmail,
        updateProfile,
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js"; 

    // ** REEMPLAZA ESTO CON TU CONFIGURACIÓN REAL DE FIREBASE **
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    // Inicializar Firebase, Auth y Firestore
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); 
    const db = getFirestore(app);

    // --- ELEMENTOS DEL DOM ---
    const authTitle = document.getElementById('authTitle');
    const authForm = document.getElementById('authForm');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const pinInput = document.getElementById('pin'); // Nuevo campo PIN
    const authButton = document.getElementById('authButton');
    const toggleAuthButton = document.getElementById('toggleAuth');
    const resetPasswordLink = document.getElementById('resetPasswordLink');
    const messageDisplay = document.getElementById('message');

    // --- VARIABLES DE ESTADO ---
    let isLoginMode = true;

    // --- FUNCIONES AUXILIARES ---
    function showMessage(msg, isError = false) {
        messageDisplay.textContent = msg;
        messageDisplay.style.color = isError ? '#d32f2f' : '#388e3c';
        messageDisplay.style.background = isError ? '#ffebee' : '#e8f5e9';
        messageDisplay.style.display = 'block';
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            authTitle.textContent = 'Iniciar Sesión';
            authButton.textContent = 'Ingresar';
            toggleAuthButton.innerHTML = '¿No tienes cuenta? Regístrate como Vendedor';
            usernameInput.style.display = 'none';
            pinInput.style.display = 'none'; // Ocultar PIN en login
            resetPasswordLink.style.display = 'block';
        } else {
            authTitle.textContent = 'Registro de Vendedor';
            authButton.textContent = 'Registrarse';
            toggleAuthButton.innerHTML = '¿Ya tienes cuenta? Iniciar Sesión';
            usernameInput.style.display = 'block';
            pinInput.style.display = 'block'; // Mostrar PIN en registro
            resetPasswordLink.style.display = 'none';
        }
        authForm.reset();
        messageDisplay.textContent = '';
        messageDisplay.style.background = 'none';
    }

    // Limitar la longitud del PIN a 6 dígitos
    pinInput.oninput = function() {
        if (this.value.length > this.maxLength) {
            this.value = this.value.slice(0, this.maxLength);
        }
    }
    
    // --- MANEJADOR DE EVENTOS PRINCIPAL ---
    authForm.onsubmit = async (e) => {
        e.preventDefault();
        
        const username = usernameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const pin = pinInput.value.trim();

        try {
            if (isLoginMode) {
                // Lógica de Login
                await signInWithEmailAndPassword(auth, email, password);
                showMessage("Inicio de sesión exitoso. Redirigiendo...", false);
            } else {
                // Lógica de Registro (Vendedor)
                if (pin.length !== 6) {
                    showMessage("El PIN de clientes debe ser de 6 dígitos.", true);
                    return;
                }
                if (username.length < 3) {
                     showMessage("El nombre de vendedor debe tener al menos 3 caracteres.", true);
                    return;
                }
                
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // 1. Asignar el nombre en Auth
                await updateProfile(user, {
                    displayName: username
                });

                // 2. Guardar datos y ROL: 'vendedor' en Firestore
                await setDoc(doc(db, "clientes", user.uid), {
                    pin: pin, // Usar el PIN proporcionado manualmente
                    email: email,
                    nombre: username,
                    acceso_concedido: true, 
                    rol: 'vendedor' 
                });
                
                // Usar localStorage para mostrar el PIN después del registro
                localStorage.setItem('tempPin', pin);
                localStorage.setItem('tempUsername', username);
                
                showMessage(`¡Registro exitoso! Tu PIN de acceso es ${pin}. Iniciando sesión...`, false);
            }

        } catch (error) {
            console.error("Error de autenticación:", error.code, error.message);
            if (error.code === 'auth/email-already-in-use') {
                showMessage('El correo ya está en uso. Intenta Iniciar Sesión o restablecer contraseña.', true);
            } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                showMessage('Credenciales inválidas. Verifica tu correo y contraseña.', true);
            } else if (error.code === 'auth/weak-password') {
                showMessage('La contraseña debe tener al menos 6 caracteres.', true);
            } else {
                showMessage(`Error: ${error.message}`, true);
            }
        }
    };
    
    // --- MANEJO DE REDIRECCIÓN POR ROL ---
    onAuthStateChanged(auth, async (user) => { 
        if (user) {
            // Se verifica si el usuario tiene un documento de rol en Firestore
            const userDocSnap = await getDoc(doc(db, "clientes", user.uid));
            const userRole = userDocSnap.exists() ? userDocSnap.data().rol : 'cliente'; 

            // Determinar la página de destino
            const redirectPage = userRole === 'vendedor' ? 'talonario.html' : 'cliente.html';

            const tempPin = localStorage.getItem('tempPin');
            const tempUsername = localStorage.getItem('tempUsername');

            if (tempPin) {
                // Si viene de un REGISTRO NUEVO (mostrando PIN por 5s)
                const container = document.querySelector('.auth-container');
                container.innerHTML = `
                    <h2>¡Bienvenido, ${tempUsername || user.displayName}!</h2>
                    <p>Tu cuenta ha sido creada exitosamente.</p>
                    <div class="pin-display">
                        Tu PIN de Acceso para clientes: <span>${tempPin}</span>
                        <p style="font-size: 0.7em; margin-top: 10px; font-weight: 400;">Guarda este número para compartir tu rifa.</p>
                    </div>
                    <p id="redirectMsg" style="color: #00838f;">Redirigiendo a tu Panel de Vendedor...</p>
                `;
                
                localStorage.removeItem('tempPin');
                localStorage.removeItem('tempUsername');
                
                setTimeout(() => {
                    window.location.href = redirectPage; 
                }, 5000); 

            } else {
                // Si viene de un LOGIN NORMAL o ya estaba autenticado
                window.location.href = redirectPage;
            }
        }
    });

    // --- MANEJADORES ADICIONALES ---
    toggleAuthButton.onclick = toggleMode;

    resetPasswordLink.onclick = async () => {
        const email = emailInput.value.trim();
        if (!email) {
            showMessage('Ingresa tu correo para restablecer la contraseña.', true);
            return;
        }
        try {
            await sendPasswordResetEmail(auth, email);
            showMessage('Se ha enviado un correo de restablecimiento a ' + email, false);
        } catch (error) {
            showMessage('Error al enviar el correo. Verifica que sea un correo registrado.', true);
        }
    };
    
</script>
</body>
</html>
