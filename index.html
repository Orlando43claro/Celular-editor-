<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalonarioDigital - Inicio</title>
    <!-- Fuente y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #c8d3e6);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #1e90ff;
            font-weight: 800;
            margin-bottom: 5px;
            font-size: 2em;
        }
        p {
            color: #6c757d;
            margin-bottom: 40px;
            font-weight: 400;
        }
        .btn-option {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Estilo Vendedor/Administrador */
        #btnVendedor {
            background: linear-gradient(45deg, #1e90ff, #3b82f6);
            color: white;
            box-shadow: 0 6px 15px rgba(30, 144, 255, 0.4);
        }
        #btnVendedor:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        /* Estilo Cliente/Visitante */
        #btnCliente {
            background: #f8f9fa;
            color: #1e90ff;
            border: 2px solid #1e90ff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        #btnCliente:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Talonario Digital</h1>
        <p>¿Cómo deseas acceder a la plataforma?</p>

        <button id="btnVendedor" class="btn-option">
            <i class="fas fa-store"></i> Acceso Vendedor
        </button>

        <button id="btnCliente" class="btn-option">
            <i class="fas fa-ticket-alt"></i> Ver Mi Rifa (Cliente)
        </button>
    </div>

<script>
    document.getElementById('btnVendedor').onclick = function() {
        // Redirige al login/registro de Vendedor
        window.location.href = 'login_vendedor.html'; 
    };

    document.getElementById('btnCliente').onclick = function() {
        // Redirige al acceso por PIN
        window.location.href = 'acceso_cliente.html'; 
    };
</script>
</body>
</html>
