<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalonarioDigital - Acceso Cliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
/* (Mismos estilos CSS que antes para body, header, .logo, h1, .vista, .input-group, etc.) */

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #84fab0 0%, #1e90ff 100%); 
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

h1 {
    color: #fff;
    font-size: clamp(2em, 5vw, 3em);
    font-weight: 700;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    margin: 0;
}

#subtituloPrincipal {
    color: #f0f0f0;
    font-size: clamp(1em, 3vw, 1.2em);
    margin-top: 10px;
}

.vista {
    width: 90%;
    max-width: 400px;
    background: #ffffff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    margin: 20px 0;
}
.vista h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 25px;
    font-weight: 600;
}

.vista form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.input-group {
    position: relative;
}
.input-group i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #95a5a6;
    font-size: 1em;
}
.vista input[type="email"], 
.vista input[type="password"],
.vista input[type="text"],
.vista input[type="number"] {
    width: 100%;
    padding: 12px 12px 12px 40px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
    transition: border-color 0.3s, box-shadow 0.3s;
    box-sizing: border-box;
}
.vista input:focus {
    border-color: #1e90ff;
    box-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
    outline: none;
}

.vista button {
    padding: 12px;
    background: linear-gradient(45deg, #1e90ff, #007bff);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: 700;
    transition: transform 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
}

.vista button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}
.notificacion {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #00ff7f;
    color: #fff;
    padding: 15px 20px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 255, 127, 0.7);
    z-index: 2000;
    display: none;
    animation: slideIn 0.5s ease forwards, slideOut 0.5s ease 2.5s forwards;
    font-weight: 600;
}
.enlace-vendedor {
    text-align: center;
    margin-top: 15px;
}
.enlace-vendedor a {
    color: #1e90ff;
    text-decoration: none;
    font-size: 0.9em;
    font-weight: 600;
}
.enlace-vendedor a:hover {
    text-decoration: underline;
}
    </style>
    <link rel="icon" id="favicon" type="image/png" href="icono-talonariodigital.png">
</head>
<body>
    <header>
        <div class="logo">
            <h1>TalonarioDigital</h1>
        </div>
        <p id="subtituloPrincipal">Ingresa tu PIN para ver los números disponibles</p>
    </header>

    <div id="pinLoginView" class="vista">
        <h2>Acceso Cliente</h2>
        <form id="pinLoginForm">
            <div class="input-group">
                <i class="fas fa-thumbtack"></i>
                <input type="number" id="pinInput" placeholder="PIN de 5 números del Vendedor" required minlength="5" maxlength="5" pattern="\d{5}" autocomplete="off">
            </div>
            <button type="submit">Ver Talonario</button>
        </form>
    </div>
    
    <div class="enlace-vendedor">
        <a href="vendedor_login.html">Soy Vendedor / Administrador</a>
    </div>

    <div id="notificacion" class="notificacion" style="display: none;">
        <p id="mensajeNotificacion"></p>
    </div>

    
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";


    // Tu configuración de Firebase (¡Asegúrate de que esta sea la real!)
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    // Inicializar Firebase y Auth
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); 
    const db = getFirestore(app); 
    

    // Función de notificación simplificada (se mantiene)
    function mostrarNotificacion(mensaje) {
        // ... (misma lógica de notificación)
        const notificacion = document.getElementById('notificacion');
        const mensajeNotificacion = document.getElementById('mensajeNotificacion');
        notificacion.style.background = mensaje.includes('Error') || mensaje.includes('⚠️') ? '#ff4757' : '#00ff7f';
        notificacion.style.boxShadow = mensaje.includes('Error') || mensaje.includes('⚠️') ? '0 0 15px rgba(255, 71, 87, 0.7)' : '0 0 15px rgba(0, 255, 127, 0.7)';
        
        mensajeNotificacion.textContent = mensaje;
        notificacion.style.animation = 'none';
        notificacion.offsetHeight; 
        notificacion.style.animation = 'slideIn 0.5s ease forwards, slideOut 0.5s ease 2.5s forwards';
        notificacion.style.display = 'block';
        setTimeout(() => { notificacion.style.display = 'none'; }, 3000);
    }


    const pinLoginForm = document.getElementById('pinLoginForm');
    const pinInput = document.getElementById('pinInput');

    pinLoginForm.onsubmit = async (e) => {
        e.preventDefault();
        const pin = pinInput.value.trim();

        if (pin.length !== 5) {
            mostrarNotificacion(`⚠️ Error: El PIN debe tener exactamente 5 números.`);
            return;
        }

        try {
            // 1. Buscar en Firestore el vendedor asociado a este PIN
            const pinDocRef = doc(db, "vendedoresPINs", pin);
            const pinDoc = await getDoc(pinDocRef);

            if (!pinDoc.exists()) {
                mostrarNotificacion(`⚠️ Error: PIN no encontrado. Verifica el código.`);
                return;
            }

            const vendedorData = pinDoc.data();
            const email = vendedorData.vendedorEmail;
            const password = vendedorData.vendedorPassword; 
            
            // 2. Usar el email y password del vendedor para autenticar al cliente
            await signInWithEmailAndPassword(auth, email, password);

            // 3. Autenticación exitosa, redirigir al cliente
            // Guardamos el PIN en sessionStorage para que cliente.html sepa qué vendedor está mirando
            sessionStorage.setItem('vendedorPIN', pin);
            mostrarNotificacion(`¡Bienvenido al talonario de ${vendedorData.vendedorDisplayName}!`);
            window.location.href = 'cliente.html';

        } catch (error) {
            let msg = 'Error desconocido al acceder. Intenta de nuevo.';
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                msg = 'Error de autenticación. El PIN podría ser incorrecto.';
            } 
            mostrarNotificacion(`⚠️ Error: ${msg}`);
            console.error(error);
        }
    };
    
    // 🛑 ESCUCHA DE AUTENTICACIÓN: Si el usuario ya está logueado, redirigir a donde corresponda.
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Si ya hay sesión, por defecto se asume que es un Vendedor o alguien que está volviendo.
            // Para mantener la seguridad, redirigimos al login de Vendedor, donde pueden re-introducir el código
            // o los enviamos a la vista de cliente si ya tienen el PIN en el sessionStorage
            if(sessionStorage.getItem('vendedorPIN')) {
                window.location.href = 'cliente.html';
            } else {
                // Si está logueado pero no tiene PIN, lo enviamos a la página de Vendedor para que se diferencie.
                window.location.href = 'vendedor_login.html'; 
            }
        }
    });

</script>
</body>
</html>
