<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalonarioDigital - Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- ESTILOS BASE --- */
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0eafc, #cfdef3); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 900px;}
        .logo { display: flex; align-items: center; justify-content: center; gap: 15px; }
        h1 { color: #2c3e50; font-size: clamp(2em, 5vw, 3em); font-weight: 700; margin: 0; }
        #subtituloPrincipal { color: #34495e; font-size: clamp(1em, 3vw, 1.2em); margin-top: 5px; }
        
        /* --- BOTONES DE CONTROL --- */
        .controles { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .controles button, .controles a { 
            padding: 10px 15px; background: #3498db; color: #fff; border: none; border-radius: 8px; cursor: pointer; 
            font-size: 1em; font-weight: 600; transition: background 0.2s, transform 0.2s; text-decoration: none; 
            display: flex; align-items: center; gap: 5px;
        }
        .controles button:hover, .controles a:hover { background: #2980b9; transform: translateY(-1px); }
        #signOutBtn { background: #e74c3c; }
        #signOutBtn:hover { background: #c0392b; }
        #btnPerfil { background: #f39c12; }
        #btnPerfil:hover { background: #e67e22; }
        #btnChat { background: #1abc9c; }
        #btnChat:hover { background: #16a085; }

        /* --- CUADRÍCULA DEL TALONARIO --- */
        #talonario { max-width: 900px; width: 100%; padding: 0 10px; box-sizing: border-box; }
        table { width: 100%; border-collapse: separate; border-spacing: 6px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); padding: 8px; table-layout: fixed; }
        td { width: 10%; height: 50px; color: #fff; font-size: clamp(0.9em, 2.5vw, 1.1em); font-weight: 600; text-align: center; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, background 0.3s; }
        td:hover { transform: scale(1.05); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        
        /* Estilos de Estado */
        td.disponible { background: linear-gradient(135deg, #6dd5fa, #2980b9); }
        td.apartado { background: #f39c12; } 
        td.pagado { background: #2ecc71; } 

        /* --- MODAL Y PERFIL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); position: relative; }
        .cerrar { position: absolute; top: 10px; right: 20px; font-size: 1.5em; cursor: pointer; color: #333; }
        .modal-content h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .modal-content label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: 600; color: #34495e; }
        .modal-content input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .modal-content button { padding: 10px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 15px; }

        /* Estilos para notificaciones (animaciones slideIn/slideOut deben estar definidas en un CSS si se usan) */
        .notificacion { position: fixed; top: 20px; right: 20px; background: #00ff7f; color: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 127, 0.7); z-index: 2000; display: none; font-weight: 600;}
        
        /* Nuevos estilos para el formulario de PIN */
        #pinForm input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>TalonarioDigital</h1>
        </div>
        <p id="subtituloPrincipal">Cargando...</p>
    </header>

    <div class="controles">
        <button id="btnPerfil"><i class="fas fa-user-cog"></i> Mi Perfil</button>
        <button id="btnChat"><i class="fas fa-comments"></i> Chat Boletos</button>
        <button id="signOutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
    </div>

    <div id="talonario">
        </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span id="cerrarInfoModal" class="cerrar">×</span>
            <h2>Boleto N° <span id="numeroBoletoDisplay"></span></h2>
            <div id="infoBoleto">
                </div>
            <div id="accionesBoleto" style="margin-top: 20px;">
                <button id="btnMarcarPagado" style="background: #2ecc71; color: white;">Marcar como Pagado</button>
                <button id="btnMarcarApartado" style="background: #f39c12; color: white; display: none;">Marcar como Apartado</button>
                <button id="btnLiberar" style="background: #e74c3c; color: white; margin-left: 10px;">Liberar Boleto</button>
                <button id="btnIniciarChat" style="background: #1abc9c; color: white; margin-top: 10px; width: 100%;">Contactar Cliente</button>
            </div>
        </div>
    </div>
    
    <div id="perfilModal" class="modal" style="z-index: 1050;">
        <div class="modal-content">
            <span id="cerrarPerfilModal" class="cerrar">×</span>
            <h2>Configuración de Cuenta</h2>
            
            <p style="margin-top: 15px; font-weight: 600; color: #1e90ff;">
                Correo: <span id="userEmailDisplayModal">Cargando...</span>
            </p>
            
            <h3 style="margin-top: 25px; color: #34495e;">Acceso para Clientes (PIN)</h3>
            <p style="font-size: 0.9em; color: #7f8c8d;">Define una clave simple para que tus clientes accedan a tu rifa desde 'Soy Cliente'.</p>
            
            <form id="pinForm" style="display: flex; gap: 5px; flex-direction: column;">
                <label for="publicPin">Tu PIN actual:</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="publicPin" required minlength="6" maxlength="10" 
                           placeholder="Ej: rifa2024" style="flex-grow: 1;">
                    <button type="submit" id="guardarPinBtn" style="background: #f39c12; color: white; min-width: 120px; padding: 10px; margin-top: 0;">
                        Guardar PIN
                    </button>
                </div>
            </form>
            
            <h3 style="margin-top: 25px; color: #34495e;">Cambio de Contraseña</h3>
            <form id="passwordForm">
                <label for="newPassword">Nueva Contraseña:</label>
                <input type="password" id="newPassword" required minlength="6">
                <button type="submit" style="background: #e67e22; color: white;">Cambiar Contraseña</button>
            </form>
            
        </div>
    </div>
    
    <div id="notificacion" class="notificacion">
        <p id="mensajeNotificacion"></p>
    </div>

    
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { 
        getAuth, 
        onAuthStateChanged, 
        signOut,
        updatePassword 
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        doc, 
        getDoc, // ⬅️ Nuevo para leer PIN
        setDoc, // ⬅️ Nuevo para guardar PIN
        updateDoc, // ⬅️ Nuevo para actualizar PIN en metadata
        deleteDoc, 
        onSnapshot, 
        serverTimestamp // ⬅️ Nuevo para timestamp del PIN
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
    
    // Tu configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
        authDomain: "talonario-rifa.firebaseapp.com",
        projectId: "talonario-rifa",
        storageBucket: "talonario-rifa.appspot.com",
        messagingSenderId: "987446023081",
        appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
        measurementId: "G-FWH8F9SVFM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); 
    const db = getFirestore(app);
    
    // 🚀 REFERENCIA A LA COLECCIÓN PÚBLICA DE PINES
    const publicKeysRef = collection(db, "publicKeys"); 

    // --- VARIABLES DE ESTADO ---
    let uidUsuarioActual = null;
    let unsubscribe = null;
    let boletoSeleccionado = null;
    let datosBoletos = {}; 

    // --- DOM ELEMENTOS ---
    const talonarioDiv = document.getElementById('talonario');
    const infoModal = document.getElementById('infoModal');
    const perfilModal = document.getElementById('perfilModal');
    const btnMarcarPagado = document.getElementById('btnMarcarPagado');
    const btnMarcarApartado = document.getElementById('btnMarcarApartado');
    const btnLiberar = document.getElementById('btnLiberar');
    const btnIniciarChat = document.getElementById('btnIniciarChat');
    const subtituloPrincipal = document.getElementById('subtituloPrincipal');
    const passwordForm = document.getElementById('passwordForm');
    
    // 🚀 ELEMENTOS DEL PIN
    const pinForm = document.getElementById('pinForm');
    const publicPinInput = document.getElementById('publicPin');
    const guardarPinBtn = document.getElementById('guardarPinBtn');

    // --- FUNCIÓN DE NOTIFICACIÓN ---
    function mostrarNotificacion(mensaje) {
        const notificacion = document.getElementById('notificacion');
        const mensajeNotificacion = document.getElementById('mensajeNotificacion');
        notificacion.style.background = mensaje.includes('Error') || mensaje.includes('⚠️') ? '#ff4757' : '#00ff7f';
        notificacion.style.boxShadow = mensaje.includes('Error') || mensaje.includes('⚠️') ? '0 0 15px rgba(255, 71, 87, 0.7)' : '0 0 15px rgba(0, 255, 127, 0.7)';
        
        mensajeNotificacion.textContent = mensaje;
        notificacion.style.animation = 'none';
        notificacion.offsetHeight; 
        notificacion.style.display = 'block';
        setTimeout(() => { notificacion.style.display = 'none'; }, 3000);
    }

    // --- LÓGICA DEL TALONARIO Y UI ---
    
    function generarTalonario(datos) { 
        talonarioDiv.innerHTML = ''; 
        datosBoletos = datos;

        const tabla = document.createElement('table');
        let numero = 0;
        for (let i = 0; i < 10; i++) {
            const fila = document.createElement('tr');
            for (let j = 0; j < 10; j++) {
                const celda = document.createElement('td');
                const numStr = numero.toString().padStart(2, '0');
                celda.dataset.numero = numStr;
                celda.textContent = numStr;
                
                const estado = datos[numStr] ? datos[numStr].estado : 'disponible';
                
                celda.classList.remove('disponible', 'apartado', 'pagado');
                celda.classList.add(estado);

                celda.addEventListener('click', function () {
                    if (estado !== 'disponible') {
                        mostrarInfoBoleto(numStr, datos[numStr]);
                    } else {
                        // El vendedor puede apartar un boleto disponible directamente
                        mostrarInfoBoleto(numStr, null); 
                    }
                });

                fila.appendChild(celda);
                numero++;
            }
            tabla.appendChild(fila);
        }
        talonarioDiv.appendChild(tabla);
    }

    function mostrarInfoBoleto(numero, datos) {
        boletoSeleccionado = numero;
        document.getElementById('numeroBoletoDisplay').textContent = numero;
        const infoDiv = document.getElementById('infoBoleto');
        const accionesDiv = document.getElementById('accionesBoleto');

        if (datos) {
            // Boleto Ocupado/Pagado
            infoDiv.innerHTML = `
                <p><strong>Estado:</strong> ${datos.estado.toUpperCase()}</p>
                <p><strong>Cliente:</strong> ${datos.nombre || 'N/A'}</p>
                <p><strong>Celular:</strong> ${datos.celular || 'N/A'}</p>
                ${datos.fechaApartado ? `<p><strong>Fecha Apartado:</strong> ${new Date(datos.fechaApartado.seconds * 1000).toLocaleString()}</p>` : ''}
            `;
            
            // Mostrar acciones
            accionesDiv.style.display = 'block';
            btnMarcarPagado.style.display = datos.estado === 'apartado' ? 'block' : 'none';
            btnMarcarApartado.style.display = datos.estado === 'pagado' ? 'block' : 'none';
            btnLiberar.style.display = 'block';
            btnIniciarChat.style.display = 'block';
        } else {
            // Boleto Disponible
            infoDiv.innerHTML = '<p><strong>Estado:</strong> DISPONIBLE</p><p>¿Deseas apartar o vender este número?</p>';
            accionesDiv.style.display = 'block';
            btnMarcarPagado.style.display = 'block'; // Permite marcar como pagado directamente
            btnMarcarApartado.style.display = 'block'; // O usar este para apartar (ejemplo: botón "Apartar para Cliente")
            btnLiberar.style.display = 'none';
            btnIniciarChat.style.display = 'none';
        }
        infoModal.style.display = 'flex';
    }


    // --- LÓGICA DE FIREBASE (CRUD) ---
    
    function iniciarOyenteTiempoReal() {
        if (unsubscribe) { unsubscribe(); } // Limpia oyente anterior

        const boletosRef = collection(db, 'users', uidUsuarioActual, 'rifas');
        
        unsubscribe = onSnapshot(boletosRef, (snapshot) => {
            let datos = {};
            snapshot.forEach(doc => {
                datos[doc.id] = doc.data();
            });
            generarTalonario(datos);
            subtituloPrincipal.textContent = `Talonario de ${auth.currentUser.displayName || auth.currentUser.email}`;
        }, (error) => {
            console.error('Error en el oyente de Firestore:', error);
            mostrarNotificacion('Error al cargar el talonario.');
        });
    }

    async function actualizarBoleto(numero, nuevoEstado, datosExtra = {}) {
        if (!uidUsuarioActual || !numero) return;

        infoModal.style.display = 'none';
        
        const boletoRef = doc(db, 'users', uidUsuarioActual, 'rifas', numero);
        
        try {
            if (nuevoEstado === 'disponible') {
                await deleteDoc(boletoRef);
                mostrarNotificacion(`✅ Boleto N° ${numero} liberado.`);
            } else {
                // Si el boleto no existe y estamos apartando/pagando, creamos los datos mínimos si no se dan.
                let datosActuales = datosBoletos[numero] || {
                    nombre: 'Vendedor', 
                    celular: 'N/A', 
                    fechaApartado: serverTimestamp() 
                };

                await setDoc(boletoRef, {
                    ...datosActuales,
                    ...datosExtra,
                    estado: nuevoEstado
                }, { merge: true });
                mostrarNotificacion(`✅ Boleto N° ${numero} marcado como ${nuevoEstado.toUpperCase()}.`);
            }
        } catch (error) {
            console.error('Error al actualizar boleto:', error);
            mostrarNotificacion(`⚠️ Error al cambiar estado: ${error.message}`);
        }
    }

    // --- MANEJADORES DE ACCIONES DE BOTÓN ---
    btnMarcarPagado.onclick = () => {
        // Lógica simple: Marcar como pagado
        actualizarBoleto(boletoSeleccionado, 'pagado');
    };

    btnMarcarApartado.onclick = () => {
        // Lógica simple: Marcar como apartado
        actualizarBoleto(boletoSeleccionado, 'apartado');
    };
    
    btnLiberar.onclick = () => {
        // Lógica simple: Marcar como disponible (Eliminar)
        actualizarBoleto(boletoSeleccionado, 'disponible');
    };

    // --- LÓGICA DE CIERRE DE SESIÓN / PERFIL ---
    document.getElementById('signOutBtn').onclick = async () => {
        if (unsubscribe) { unsubscribe(); }
        await signOut(auth);
        window.location.href = 'inicio.html'; // Redirigir al menú de roles
    };
    
    // --- LÓGICA DE PERFIL (CONTRASEÑA) ---
    passwordForm.onsubmit = async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const user = auth.currentUser;
        
        if (newPassword.length < 6) {
            mostrarNotificacion("⚠️ La contraseña debe tener al menos 6 caracteres.");
            return;
        }

        try {
            await updatePassword(user, newPassword);
            mostrarNotificacion("✅ Contraseña actualizada con éxito.");
            perfilModal.style.display = 'none';
        } catch (error) {
            console.error('Error al cambiar contraseña:', error);
            // Si el error es 'auth/requires-recent-login', Firebase necesita que el usuario se reautentique
            mostrarNotificacion(`⚠️ Error al actualizar contraseña. Por favor, inicia sesión de nuevo e intenta. (${error.code})`);
        }
    };
    
    // 🚀 LÓGICA DE PERFIL (GESTIÓN DEL PIN)
    async function handlePinSave(e) {
        e.preventDefault();
        const newPin = publicPinInput.value.trim().toLowerCase();
        const currentUid = auth.currentUser.uid;

        if (newPin.length < 6 || newPin.length > 10) {
            mostrarNotificacion("⚠️ El PIN debe tener entre 6 y 10 caracteres.");
            return;
        }
        
        guardarPinBtn.disabled = true;
        guardarPinBtn.textContent = 'Guardando...';

        try {
            // 1. Intentar GUARDAR el PIN en la colección pública (publicKeys)
            await setDoc(doc(publicKeysRef, newPin), {
                uid: currentUid,
                timestamp: serverTimestamp()
            });
            
            // 2. Guardar el PIN en el perfil del vendedor para recordarlo (metadata)
            const userMetadataRef = doc(db, "users", currentUid, "metadata", "chatStatus");
            await updateDoc(userMetadataRef, {
                publicPin: newPin 
            }, { merge: true });

            mostrarNotificacion(`✅ PIN de Cliente "${newPin}" guardado con éxito. ¡Compártelo!`);
            perfilModal.style.display = 'none';

        } catch (error) {
            let msg = 'Error desconocido al guardar el PIN.';
            if (error.code === 'permission-denied') {
                 msg = '⚠️ Parece que este PIN ya está en uso. Elige otro.';
            }
            console.error("Error al guardar PIN:", error);
            mostrarNotificacion(msg);
        } finally {
             guardarPinBtn.disabled = false;
             guardarPinBtn.textContent = 'Guardar PIN';
        }
    }

    function setupPerfilListeners() {
        // Vincular la función de guardado del PIN
        if(pinForm) {
            pinForm.addEventListener('submit', handlePinSave);
        }
        
        document.getElementById('btnPerfil').onclick = async () => {
            const user = auth.currentUser;
            if (!user) { return; }
            
            // Mostrar correo
            document.getElementById('userEmailDisplayModal').textContent = user.email;

            // Cargar el PIN actual para mostrarlo en el input
            const pinDoc = await getDoc(doc(db, "users", user.uid, "metadata", "chatStatus"));
            const currentPin = (pinDoc.exists() && pinDoc.data().publicPin) ? pinDoc.data().publicPin : '';
            
            if(publicPinInput) {
                publicPinInput.value = currentPin;
            }
            
            perfilModal.style.display = 'flex';
        };

        // Cierres de Modales
        document.getElementById('cerrarInfoModal').onclick = () => { infoModal.style.display = 'none'; };
        document.getElementById('cerrarPerfilModal').onclick = () => { perfilModal.style.display = 'none'; };
        infoModal.onclick = (e) => { if (e.target === infoModal) { infoModal.style.display = 'none'; } };
        perfilModal.onclick = (e) => { if (e.target === perfilModal) { perfilModal.style.display = 'none'; } };
    }


    // --- INICIALIZACIÓN DE SESIÓN ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            uidUsuarioActual = user.uid;
            iniciarOyenteTiempoReal();
            setupPerfilListeners();
        } else {
            // Si no hay usuario autenticado, redirigir al menú de roles
            window.location.href = 'inicio.html';
        }
    });

</script>
</body>
</html>
